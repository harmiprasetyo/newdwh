stages:
  - check_network
  - build_check
  - deploy

default:
  interruptible: true
  tags:
    - diskominfo-runner

# ====================================================
# STAGE 0: CHECK NETWORK
# ====================================================
check-network:
  stage: check_network
  image: alpine:latest

  before_script:
    - apk add --no-cache iproute2 iputils netcat-openbsd curl

  script:
    - echo "=== IP Runner ==="
    - hostname -I || ip addr show || true

    - echo "=== Routing ==="
    - ip route || true

    - echo "=== Route ke VM Dinkes ==="
    - ip route get 10.100.17.118 || true

    - echo "=== Test Ping ==="
    - ping -c 3 10.100.17.118 || true

    - echo "=== Test SSH Port ==="
    - nc -vz -w 5 10.100.17.118 22 || true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ====================================================
# CACHE
# ====================================================
cache:
  key:
    files:
      - package-lock.json

  paths:
    - .npm/


# ====================================================
# STAGE 1: BUILD CHECK
# ====================================================
cek_build_frontend:
  stage: build_check
  image: node:20-alpine

  variables:
    NEXT_TELEMETRY_DISABLED: "1"

  before_script:
    - npm ci --legacy-peer-deps --cache .npm --prefer-offline

  script:
    - echo "=== MENCOBA PROSES BUILD APLIKASI ==="
    - npm run build

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# ====================================================
# STAGE 2: DEPLOY PRODUCTION
# ====================================================
deploy_production:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client sshpass

  script:
    - |
      sshpass -p "$SSH_PASSWORD" ssh \
        -o StrictHostKeyChecking=no \
        -o UserKnownHostsFile=/dev/null \
        admin_primary_dwh@10.100.17.118 << 'EOF'

        set -e

        cd /home/admin_primary_dwh/newdwh

        echo "========================================"
        echo "=== UPDATE SOURCE CODE ==="
        echo "========================================"

        git fetch origin main
        git reset --hard origin/main

        echo "=== DEPLOY COMMIT ==="
        git rev-parse --short HEAD

        echo "========================================"
        echo "=== REBUILD & RESTART CONTAINER ==="
        echo "========================================"

        docker compose up -d --build app

        echo "========================================"
        echo "=== CONTAINER STATUS ==="
        echo "========================================"

        docker compose ps

        echo "========================================"
        echo "=== DEPLOYMENT SELESAI ==="
        echo "========================================"

      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
