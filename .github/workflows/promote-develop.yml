name: Promote Develop to Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Pilih target release"
        required: true
        type: choice
        options:
          - bogor
          - bekasi
          - both

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-develop-to-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # SHOW TARGET
      # ============================================================
      - name: Show promotion target
        run: |
          echo "======================================"
          echo "Source : develop"
          echo "Target : ${{ inputs.target }}"
          echo "======================================"

      # ============================================================
      # VERIFY DEVELOP
      # ============================================================
      - name: Verify develop branch
        run: |
          git fetch origin develop

          echo "Latest develop commit:"
          git log origin/develop -1 --oneline

      # ============================================================
      # CREATE PR TO BOGOR
      # ============================================================
      - name: Create PR to Bogor
        if: inputs.target == 'bogor' || inputs.target == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "======================================"
          echo "Checking PR develop -> release/bogor"
          echo "======================================"

          EXISTING_PR=$(gh pr list \
            --base release/bogor \
            --head develop \
            --state open \
            --json number,url \
            --jq '.[0] | "\(.number) \(.url)"')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR Bogor sudah ada:"
            echo "$EXISTING_PR"
          else
            echo "Membuat PR develop -> release/bogor..."

            gh pr create \
              --base release/bogor \
              --head develop \
              --title "Promote develop to release/bogor" \
              --body "Promotion dari develop ke release/bogor."
          fi

      # ============================================================
      # CREATE PR TO BEKASI
      # ============================================================
      - name: Create PR to Bekasi
        if: inputs.target == 'bekasi' || inputs.target == 'both'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "======================================"
          echo "Checking PR develop -> release/bekasi"
          echo "======================================"

          EXISTING_PR=$(gh pr list \
            --base release/bekasi \
            --head develop \
            --state open \
            --json number,url \
            --jq '.[0] | "\(.number) \(.url)"')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR Bekasi sudah ada:"
            echo "$EXISTING_PR"
          else
            echo "Membuat PR develop -> release/bekasi..."

            gh pr create \
              --base release/bekasi \
              --head develop \
              --title "Promote develop to release/bekasi" \
              --body "Promotion dari develop ke release/bekasi."
          fi
