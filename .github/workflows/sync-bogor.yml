name: Sync GitHub to GitLab Bogor

on:
  push:
    branches:
      - release/bogor

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab Bogor
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
        run: |
          git remote add gitlab-bogor \
            https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPO}

          git push gitlab-bogor release/bogor:main

