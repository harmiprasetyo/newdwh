name: Module to Develop

on:
  push:
    branches:
      - 'modul/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base develop \
            --head "${GITHUB_REF_NAME}" \
            --title "Merge ${GITHUB_REF_NAME} into develop" \
            --body "Automatic PR dari ${GITHUB_REF_NAME} ke develop." \
            || echo "PR sudah ada atau tidak dapat dibuat."
